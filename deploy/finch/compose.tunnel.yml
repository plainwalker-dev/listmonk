# Private, outbound-only ChatGPT connection. Do not enable the public mcp profile.
# Create root-readable secret files after approval; never commit their values.
services:
  tunnel:
    profiles: [tunnel]
    image: finch-newsletter-tunnel:0.1.0
    build:
      context: ../../mcp
      dockerfile: Dockerfile.tunnel
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - ${FINCH_MCP_ENV_FILE:-/etc/finch-newsletter/mcp.env}
      - ${FINCH_TUNNEL_ENV_FILE:-/etc/finch-newsletter/tunnel.env}
    environment:
      LISTMONK_URL: http://app:9000
      MCP_TRANSPORT: stdio
      ENABLE_SEND: 'false'
      HEALTH_LISTEN_ADDR: 127.0.0.1:8080
      LOG_LEVEL: warn
      LOG_FORMAT: json
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 384m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 4
